<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帳票PDFプレビュー</title><style>
*{box-sizing:border-box}body{margin:0;background:#dce2e8;font:16px system-ui;color:#172b3e}nav{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:8px;background:#fff;border-bottom:1px solid #aebccb}button,select{font:inherit;min-height:40px;padding:5px 9px}#sheet{overflow:auto;padding:12px;text-align:center;height:calc(100dvh - 65px)}canvas{display:block;margin:0 auto;background:white;box-shadow:0 2px 8px #0003}#status{padding:8px;text-align:center;background:white}#status:empty{display:none}
</style><nav><button id="prev" disabled>前へ</button><label>ページ <select id="page" aria-label="表示ページ"></select></label><span id="count"></span><button id="next" disabled>次へ</button><select id="zoom" aria-label="表示倍率"><option value="fit">幅に合わせる</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></nav><div id="status" role="status">PDFを読み込んでいます…</div><div id="sheet"><canvas id="canvas"></canvas></div><script type="module">
import {getDocument,GlobalWorkerOptions} from './assets/pdfjs/pdf.min.mjs';
GlobalWorkerOptions.workerSrc=new URL('./assets/pdfjs/pdf.worker.min.mjs',location.href).href;
const $=id=>document.getElementById(id);let pdf,pageNumber=1,task,sequence=0;
async function render(){const ticket=++sequence;if(task){task.cancel();try{await task.promise}catch{}}try{const page=await pdf.getPage(pageNumber);if(ticket!==sequence)return;const natural=page.getViewport({scale:1});const scale=$('zoom').value==='fit'?Math.max(.1,($('sheet').clientWidth-24)/natural.width):Number($('zoom').value)*96/72;const viewport=page.getViewport({scale});const ratio=Math.min(window.devicePixelRatio||1,2,Math.sqrt(8000000/(viewport.width*viewport.height)));const canvas=$('canvas');canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';$('prev').disabled=pageNumber===1;$('next').disabled=pageNumber===pdf.numPages;$('page').value=String(pageNumber);$('status').textContent='';task=page.render({canvasContext:canvas.getContext('2d'),viewport,transform:[ratio,0,0,ratio,0,0]});await task.promise}catch(e){if(e.name!=='RenderingCancelledException')$('status').textContent='表示できませんでした。「PDFを保存」からファイルを開いてください。'}}
$('prev').onclick=()=>{if(pageNumber>1){pageNumber--;render()}};$('next').onclick=()=>{if(pageNumber<pdf.numPages){pageNumber++;render()}};$('page').onchange=()=>{pageNumber=Number($('page').value);render()};$('zoom').onchange=()=>render();let timer;window.onresize=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(pdf)render()},200)};
try{const url=decodeURIComponent(location.hash.slice(1));if(!url.startsWith('blob:'+location.origin+'/'))throw Error('Invalid PDF URL');pdf=await getDocument({url,isEvalSupported:false}).promise;for(let i=1;i<=pdf.numPages;i++)$('page').add(new Option(String(i),String(i)));$('count').textContent='/ '+pdf.numPages;await render()}catch(e){$('status').textContent='PDFを読み込めませんでした。元の画面でPDFを再作成するか、「PDFを保存」をお使いください。'}
</script></html>
