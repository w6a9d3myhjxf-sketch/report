<script>
const KINDS=['路肩','走行','追越','清掃','植栽','事故','小補修','雪氷','外販','その他'];const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fields=['date','weather','job','company','primary','chief','baseout','basein','billstart','billend','nightstart','nightend','confirmed','breakMinutes'];const SAMPLE_PEOPLE=["山田 太郎", "佐藤 健一", "鈴木 一郎", "高橋 大輔", "田中 誠", "伊藤 拓也", "渡辺 浩", "小林 直樹", "加藤 修", "吉田 和也", "山本 裕介", "中村 亮", "斎藤 正人", "松本 哲也", "井上 翔", "木村 達也", "林 健太", "清水 隆", "阿部 博之", "森田 俊介"];let personMaster=[];let baseOverrides={baseout:false,basein:false};let data={works:[],people:[],crews:[],vehicles:[],materials:[],waste:[],prices:[]};const templates={works:{route:'東北道',item:'',start:'',end:'',place:'',kind:[],manual:'',check:'合',note:'',_overrideStart:false,_overrideEnd:false},people:{name:'',role:'作業員',start:'',end:'',note:'',includeTimeConfirmation:false,_overrideStart:false,_overrideEnd:false},crews:{a:'タイヨー株式会社',b:''},vehicles:{a:'',b:'',c:'1'},materials:{a:'',b:'',c:''},waste:{a:'',b:'',c:''},prices:{a:'',b:'',c:'h'}};
let workItemMaster=[];
try{const stored=JSON.parse(localStorage.getItem('dailyReportWorkItemMasterV1')||'[]');if(Array.isArray(stored))workItemMaster=[...new Set(stored.filter(v=>typeof v==='string').map(v=>v.trim()).filter(Boolean))];}catch{}
function registerWorkItem(){
 const answer=prompt('作業項目リストに登録する名称を入力してください');if(answer===null)return;
 const name=answer.trim();if(!name)return;warnFilenameChars(name);
 if(workItemMaster.includes(name)){alert('すでに登録されています。作業項目のリストから選択してください。');return;}
 const next=[...workItemMaster,name];
 try{localStorage.setItem('dailyReportWorkItemMasterV1',JSON.stringify(next));workItemMaster=next;render('works');renderConfirmEditor();}catch(e){alert('作業項目を保存できませんでした。');}
}
function selectWorkItem(index,value){
 if(value==='__manual__'){const answer=prompt('この行の作業項目を入力してください（リストへの登録は「作業項目を追加」から）',data.works[index].item||'');if(answer===null){render('works');return;}value=answer.trim();}
 change('works',index,'item',value);render('works');renderConfirmEditor();
}
function selectedWorkerCount(){return data.people.filter(person=>String(person.name||'').trim()).length;}
function syncCrewCounts(){const count=String(selectedWorkerCount());for(const row of data.crews){row.b=count;delete row.c;}document.querySelectorAll('[data-crew-count]').forEach(input=>input.value=count);}
function input(k,i,f,v){const detailLabels={vehicles:{a:'種類',b:'車番等',c:'単位'},materials:{a:'材料名',b:'規格・寸法',c:'数量'},waste:{a:'品名',b:'数量',c:'単位'}};const detailLabel=detailLabels[k]?.[f];if(detailLabel)return `<input value="${esc(v)}" placeholder="${detailLabel}" aria-label="${detailLabel}" oninput="change('${k}',${i},'${f}',this.value)">`;if(k==='crews'&&f==='b')return `<input type="number" min="0" step="1" data-crew-count readonly aria-label="人数" value="${selectedWorkerCount()}">`;if(k==='works'&&f==='item')return `<select aria-label="作業項目" onchange="selectWorkItem(${i},this.value)"><option value="">作業項目を選択</option>${workItemMaster.map(name=>`<option value="${esc(name)}" ${v===name?'selected':''}>${esc(name)}</option>`).join('')}${v&&!workItemMaster.includes(v)?`<option value="${esc(v)}" selected>${esc(v)}</option>`:''}<option value="__manual__">リスト外の項目を入力…</option></select>`;if(k==='people'&&f==='name')return `<select aria-label="作業員の氏名" onchange="selectPerson(${i},this.value)"><option value="">氏名を選択</option>${personMaster.map(n=>`<option value="${esc(n)}" ${v===n?'selected':''}>${esc(n)}</option>`).join('')}${v&&!personMaster.includes(v)?`<option value="${esc(v)}" selected>${esc(v)}（臨時）</option>`:''}<option value="__manual__">＋ リスト外の氏名を入力…</option></select>`;const opts=f==='route'?['東北道','圏央道','その他']:f==='check'?['合','否','―']:f==='role'?['責任者','作業員','交代','増員']:null;const list=opts?`<select onchange="change('${k}',${i},'${f}',this.value)">${opts.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input ${['start','end'].includes(f)&&k==='works'?'type="time"':''} value="${esc(v)}" placeholder="${({a:'名称／会社',b:'車番・規格・数量',c:'単位',name:'氏名',item:'作業項目',place:'場所',kind:'工種',manual:'手順書',note:'備考'})[f]||f}" oninput="change('${k}',${i},'${f}',this.value)">`;return list}
function selectPerson(i,v){if(v==='__manual__'){const n=prompt('臨時作業員の氏名を入力してください',data.people[i].name||'');if(n===null){render('people');return;}v=n.trim();}change('people',i,'name',v);render('people')}
function renderPersonMaster(){const el=$('personNames');if(el)el.innerHTML=personMaster.map(n=>`<option value="${esc(n)}"></option>`).join('')}
function registerPerson(){const n=prompt('登録する作業員の氏名を入力してください');if(n===null)return;const name=n.trim();if(!name)return;if(personMaster.includes(name))return alert('すでに登録されています');personMaster.push(name);personMaster.sort((a,b)=>a.localeCompare(b,'ja'));renderPersonMaster();persistPersonMaster();render('people')}
function managePeople(){const before=personMaster.join('\n');const result=prompt('作業員名簿を編集（1行につき1人）。削除したい名前は行ごと消してください。',before);if(result===null)return;personMaster=[...new Set(result.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];renderPersonMaster();persistPersonMaster();render('people')}
function persistPersonMaster(){localStorage.setItem('dailyReportPersonMasterV1',JSON.stringify(personMaster))}
function normalizeKinds(r){if(Array.isArray(r.kind))return r.kind;if(typeof r.kind==='string'&&r.kind.trim())return r.kind.split(/[、,\s]+/).filter(Boolean);return []}
function toggleKind(i,kind,checked){const r=data.works[i];const a=normalizeKinds(r);r.kind=checked?[...new Set([...a,kind])]:a.filter(x=>x!==kind)}
function render(k){if(k==='crews')syncCrewCounts();let html='';data[k].forEach((r,i)=>{let keys=Object.keys(templates[k]).filter(f=>!f.startsWith('_')&&!(k==='works'&&f==='kind'));const workLabels={route:'路線',item:'作業項目',start:'始業',end:'終業',place:'作業場所',manual:'手順書No.',check:'確認',note:'備考'};const row=keys.map(f=>k==='works'?`<label class="work-field"><span>${workLabels[f]||f}</span>${input(k,i,f,r[f])}</label>`:k==='crews'?`<label class="field"><span>${f==='a'?'会社名':'人数'}</span>${input(k,i,f,r[f])}</label>`:input(k,i,f,r[f])).join('');if(k==='works'){const selected=normalizeKinds(r);const check=KINDS.map(v=>`<label><input type="checkbox" ${selected.includes(v)?'checked':''} onchange="toggleKind(${i},'${v}',this.checked)">${v}</label>`).join('');html+=`<div class="workcard"><div class="rowedit" style="grid-template-columns:120px 1.4fr 110px 110px 1.5fr 95px 85px 1.2fr 42px">${row}<button class="danger" title="削除" onclick="del('${k}',${i})">×</button></div><div class="kindbox"><strong style="font-size:12px">工種区分</strong>${check}</div></div>`}else{html+=`<div class="${k==='people'?'roster':k==='crews'?'simple crew-row':'simple'}">${k==='prices'?row.replace('placeholder="名称／会社"','placeholder="単価項目名"').replace('placeholder="車番・規格・数量"','placeholder="数量"'):row}<button class="danger" title="削除" onclick="del('${k}',${i})">×</button></div>`}});$(k).innerHTML=html}
function invalidFilenameChars(value){return String(value??'').match(/[\\/:*?"<>|\x00-\x1f]/g)||[]}
function warnFilenameChars(value,previous=''){const before=invalidFilenameChars(previous),now=invalidFilenameChars(value);if(now.some(c=>now.filter(x=>x===c).length>before.filter(x=>x===c).length))alert('ファイル名に使えない記号が含まれています：'+[...new Set(now)].join(' ')+'\nバックアップ保存時は「_」に置き換えます。')}
function backupFilenamePart(value){return Array.from(String(value??'').trim().replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').replace(/[. ]+$/g,'')).slice(0,55).join('')}
function backupFilename(){const first=data.works[0]||{};return [$('date').value||'日付未入力',backupFilenamePart(first.item)||'作業項目未入力',backupFilenamePart(first.place)||'作業場所未入力'].join('_')+'.json'}
function change(k,i,f,v){if(k==='works'&&['item','place'].includes(f))warnFilenameChars(v,data[k][i][f]);data[k][i][f]=v;if((k==='works'||k==='people')&&(f==='start'||f==='end'))data[k][i][f==='start'?'_overrideStart':'_overrideEnd']=true}function manualBase(id){baseOverrides[id]=true}function addWork(){data.works.push({...templates.works,start:$('billstart').value.slice(11,16),end:$('billend').value.slice(11,16)});render('works')}function addPerson(){data.people.push({...templates.people,start:$('billstart').value.slice(11,16),end:$('billend').value.slice(11,16)});render('people')}function addSimple(k){data[k].push({...templates[k]});render(k)}function del(k,i){data[k].splice(i,1);render(k)}function state(){let obj={};fields.forEach(f=>obj[f]=$(f).value);return {...obj,rows:data,baseOverrides,personMaster}}function load(obj){fields.forEach(f=>{if(obj[f]!=null)$(f).value=obj[f]});data={...data,...(obj.rows||{})};if(Array.isArray(obj.personMaster)&&obj.personMaster.length){personMaster=[...new Set(obj.personMaster.filter(x=>typeof x==='string'))];persistPersonMaster();renderPersonMaster()}baseOverrides={baseout:false,basein:false,...(obj.baseOverrides||{})};data.works.forEach(r=>r.kind=normalizeKinds(r));if($('billstart').value)$('timelineDate').value=$('billstart').value.slice(0,10);Object.keys(data).forEach(render);propagateTimes(false);drawTimeline();updateConfirmBanner()}function save(){const t=window.SaveTerminal;t.begin('SAVE REPORT');try{t.line('> Collecting report data...');const payload=JSON.stringify(state());t.line('[OK] Report data serialized.');t.line('> Writing to browser storage...');localStorage.setItem('dailyReportV1',payload);if(localStorage.getItem('dailyReportV1')!==payload)throw Error('Storage verification failed.');t.line('[OK] Local save verified.');t.line('Destination: this browser / this device.');t.success()}catch(e){t.fail('Local save failed. Your changes have not been confirmed saved.');console.error(e)}}function exportJSON(){const t=window.SaveTerminal;t.begin('EXPORT JSON');let url;try{t.line('> Collecting report data...');const payload=JSON.stringify(state(),null,2);t.line('[OK] JSON backup created.');const blob=new Blob([payload],{type:'application/json'}),a=document.createElement('a');url=URL.createObjectURL(blob);a.href=url;a.download=backupFilename();t.line('File: '+a.download);document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);t.line('[OK] Download request sent to browser.');t.line('Complete the save in your browser if prompted.');t.success()}catch(e){if(url)URL.revokeObjectURL(url);t.fail('JSON export failed. Please try again.');console.error(e)}}function importJSON(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{load(JSON.parse(reader.result));alert('復元しました')}catch(err){alert('読み込みに失敗しました')}};reader.readAsText(f)}function newDoc(){if(!confirm('入力中の内容を新規作成で初期化しますか？ 保存が必要ならキャンセルしてください。'))return;localStorage.removeItem('dailyReportV1');location.reload()}
function parseDT(v){return v?new Date(v):null}function timeMinutes(v){const p=(v||'').split(':').map(Number);return p.length===2?p[0]*60+p[1]:0}function withinNight(m){const s=timeMinutes($('nightstart').value),e=timeMinutes($('nightend').value);return s<e?(m>=s&&m<e):(m>=s||m<e)}function calc(){const a=parseDT($('billstart').value),b=parseDT($('billend').value);if(!a||!b||b<=a)return null;let day=0,night=0;for(let t=a.getTime();t<b.getTime();){let next=Math.min(b.getTime(),t+60000),d=new Date(t),m=d.getHours()*60+d.getMinutes();if(withinNight(m))night+=(next-t)/60000;else day+=(next-t)/60000;t=next}const gross=day+night,enabled=$('breakEnabled').checked,raw=$('breakMinutes').value,rest=enabled?Number(raw):0;
const error=enabled&&(raw.trim()===''||!Number.isInteger(rest)||rest<0)?'休憩時間は0以上の整数（分）で入力してください。':rest>gross?'休憩時間が開始～終了の時間を超えています。':'';
return {day,night,gross,breakMinutes:rest,total:error?null:gross-rest,breakError:error}}
function adjustBreakMinutes(delta){if(!$('breakEnabled').checked)return;const raw=Number($('breakMinutes').value);$('breakMinutes').value=String(Math.max(0,(Number.isFinite(raw)?raw:0)+delta));drawTimeline();}
function breakMinuteKey(event){if(event.key==='ArrowUp'||event.key==='ArrowDown'){event.preventDefault();adjustBreakMinutes(event.key==='ArrowUp'?5:-5);}}
function updateBreakControls(){const off=!$('breakEnabled').checked;$('breakMinutes').disabled=off;document.querySelectorAll('[data-rest-step]').forEach(button=>button.disabled=off);drawTimeline();}
function selectedDay(){const raw=$('timelineDate').value||($('billstart').value||'').slice(0,10)||$('date').value;return raw}
function timelineDateTime(day,minute){const d=new Date(day+'T00:00:00');d.setMinutes(minute);return d}
function drawTimeline(){
 const c=calc(),a=parseDT($('billstart').value),b=parseDT($('billend').value),day=selectedDay();
 let out='',zero=day?timelineDateTime(day,0):null,z=zero?zero.getTime():0;
 // 24時間表示上では終了が開始より左でも翌日終了として計上する。
 // 実際の計上時間はdatetime-localの年月日を使用する。
 for(let i=0;i<288;i++){
   const m=i*5, sm=a?a.getHours()*60+a.getMinutes():null, em=b?b.getHours()*60+b.getMinutes():null;
   let active=false;
   if(a&&b&&b>a){
     const dur=(b.getTime()-a.getTime())/60000;
     if(dur>=1440)active=true;
     else if(em>sm)active=m>=sm&&m<em;
     else active=m>=sm||m<em;
   }
   const kind=active?(withinNight(m)?'night':'day'):'outside';
   out+=`<div class="segment ${kind}" style="flex:1" title="${String(Math.floor(i/12)).padStart(2,'0')}:${String(i%12*5).padStart(2,'0')} ${active?'計上対象':'時間外'}"></div>`;
 }
 const marks=[['start',a?a.getHours()*60+a.getMinutes():480],['nightstart',timeMinutes($('nightstart').value)],['nightend',timeMinutes($('nightend').value)],['end',b?b.getHours()*60+b.getMinutes():1020]];
 const names={start:'開始',nightstart:'夜間開始',nightend:'夜間終了',end:'終了'};
 for(const [name,m] of marks){
   if(!zero)continue;
   const value=name==='start'?$('billstart').value:name==='end'?$('billend').value:$(name).value;
   const clock=name==='start'||name==='end'?(value||'').slice(11,16):value;
   out+=`<div class="time-handle ${name}" role="slider" tabindex="0" aria-label="${names[name]}" aria-valuemin="0" aria-valuemax="1440" aria-valuenow="${Math.round(m)}" data-handle="${name}" style="left:${(m/1440*100).toFixed(4)}%" title="${names[name]} ${value}"><span class="handle-label"><small>${names[name]}</small><strong>${clock}</strong></span></div>`;
 }
 $('timeline').innerHTML=out;
 const fmt=n=>{const total=Math.round(n),hours=Math.floor(total/60),minutes=String(total%60).padStart(2,'0');return `<div class="duration-value">${hours}<small>時間</small>${minutes}<small>分</small></div>`};
 $('breakError').textContent=c?.breakError||'';
 if(typeof renderLabor==='function')renderLabor();
 $('stats').innerHTML=c?`<b class="range-total"><span>開始 ～ 終了</span>${a?localDateTime(a).slice(11,16):''} ～ ${b?localDateTime(b).slice(11,16):''}</b><b class="day-total"><span>昼間</span>${fmt(c.day)}</b><b class="night-total"><span>夜間</span>${fmt(c.night)}</b><b class="all-total"><span>${$('breakEnabled').checked?'合計（休憩控除後）':'合計'}</span>${c.breakError?'—':fmt(c.total)}</b>`:'<b>計上開始・終了を入力してください</b>';
}
let dragging=null;
function setHandleMinute(name,minute){
 minute=Math.max(0,Math.min(1440,minute));
 if(name==='nightstart'||name==='nightend'){
   const m=minute%1440;$(name).value=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
 }else{
   // 基準日は開始の年月日。スライダーは24時間の時計として動作する。
   // 例：開始22:00・終了04:00 → 終了は自動的に翌日04:00。
   const base=($('billstart').value||'').slice(0,10)||selectedDay();
   if(!base)return;
   const m=minute%1440;
   const clock=`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
   if(name==='start'){
     $('billstart').value=base+'T'+clock;
     const endClock=($('billend').value||'').slice(11,16)||'17:00';
     const endMinute=timeMinutes(endClock);
     const endDate=timelineDateTime(base,endMinute<=m?1440+endMinute:endMinute);
     $('billend').value=localDateTime(endDate);
   }else{
     const startMinute=timeMinutes(($('billstart').value||'').slice(11,16)||'08:00');
     const endDate=timelineDateTime(base,m<=startMinute?1440+m:m);
     $('billend').value=localDateTime(endDate);
   }
 }
 markUnconfirmed();propagateTimes();drawTimeline();
}
function dragTime(ev){
 if(!dragging)return;
 const r=$('timeline').getBoundingClientRect(),ratio=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width));
 setHandleMinute(dragging,Math.round(ratio*288)*5);
}
$('timeline').addEventListener('pointerdown',ev=>{
 const handle=ev.target.closest('.time-handle');
 if(handle){dragging=handle.dataset.handle}else{
   const r=$('timeline').getBoundingClientRect(),pos=Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width)),m=pos*1440;
   const a=parseDT($('billstart').value),b=parseDT($('billend').value);
   const marks=[['start',a?a.getHours()*60+a.getMinutes():0],['nightstart',timeMinutes($('nightstart').value)],['nightend',timeMinutes($('nightend').value)],['end',b?b.getHours()*60+b.getMinutes():1440]];
   dragging=marks.filter(x=>x[1]!=null&&x[1]>=0&&x[1]<=1440).sort((x,y)=>Math.abs(x[1]-m)-Math.abs(y[1]-m))[0]?.[0]||'start';
 }
 $('timeline').setPointerCapture(ev.pointerId);dragTime(ev);
});
$('timeline').addEventListener('pointermove',ev=>{if(dragging)dragTime(ev)});
$('timeline').addEventListener('pointerup',()=>dragging=null);
$('timeline').addEventListener('pointercancel',()=>dragging=null);
$('timeline').addEventListener('keydown',ev=>{
 const h=ev.target.closest('.time-handle');if(!h||!['ArrowLeft','ArrowRight'].includes(ev.key))return;
 ev.preventDefault();const name=h.dataset.handle,minute=(name.startsWith('night')?timeMinutes($(name).value):timeMinutes(($(name==='start'?'billstart':'billend').value||'').slice(11,16)));
 if(Number.isFinite(minute))setHandleMinute(name,minute+(ev.key==='ArrowRight'?5:-5));
 $('timeline').querySelector(`[data-handle="${name}"]`)?.focus();
});
function markUnconfirmed(){
 if($('confirmed').value==='yes'){
   $('confirmed').value='no';
 }
 updateConfirmBanner();
}
function updateConfirmBanner(){
 const yes=$('confirmed').value==='yes';
 const el=$('confirmBanner');if(!el)return;
 el.style.background=yes?'#e5f4e9':'#fff7dc';el.style.color=yes?'#175c35':'#72510b';
 el.textContent=yes?'確定済み：共通計上時刻を確定しました。個別訂正は保持しています。':'未確定：スライダー操作は即時反映されます。確認後に「計上時刻を確定」を押してください。';
}
function propagateTimes(shouldRender=true){
 const sh=$('billstart').value.slice(11,16),eh=$('billend').value.slice(11,16);
 if(!baseOverrides.baseout)$('baseout').value=sh;
 if(!baseOverrides.basein)$('basein').value=eh;
 for(const k of ['works','people'])for(const r of data[k]){
   if(!r._overrideStart)r.start=sh;
   if(!r._overrideEnd)r.end=eh;
 }
 if(shouldRender){render('works');render('people')}
}
function resetIndividualTimes(){
 if(!confirm('基地発・基地着・全作業項目・全作業員の個別訂正を解除して、スライダー時刻に揃えますか？'))return;
 baseOverrides={baseout:false,basein:false};
 for(const k of ['works','people'])for(const r of data[k]){r._overrideStart=false;r._overrideEnd=false}
 propagateTimes();
}
function confirmTimes(){
 const a=parseDT($('billstart').value),b=parseDT($('billend').value);
 if(!a||!b||b<=a){alert('計上開始・終了の日時を正しく入力してください。');return}
 propagateTimes();
 $('confirmed').value='yes';updateConfirmBanner();
 alert('計上時刻を確定しました。個別に訂正した欄はそのまま保持しています。');
}
function syncTime(){markUnconfirmed();if(!$('timelineDate').value&&$('billstart').value)$('timelineDate').value=$('billstart').value.slice(0,10);propagateTimes();drawTimeline()}
function shiftEnd(delta){markUnconfirmed();let d=parseDT($('billend').value);if(!d)return alert('計上終了を先に入力してください');d=new Date(d.getTime()+delta*60000);$('billend').value=localDateTime(d);propagateTimes();drawTimeline()}
function localDateTime(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function applyEnd(){const end=$('billend').value;if(!end)return alert('計上終了を入力してください');const hh=end.slice(11,16);data.works.forEach(r=>{if(!r._overrideEnd)r.end=hh});render('works')}
